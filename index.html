<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>兵庫県で農家になる</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ★ テーマ（好みに応じて vue.css, dark.css, pure.css などに変更可能） -->
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

  <!-- 1. Google Fonts から使いたいフォントを読み込む（例: Noto Sans JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* カバーページの背景画像を不透明度（透過）付きで表示する場合 */
    .cover.show {
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)),
        url('media/cover.png') center center / cover no-repeat !important;
    }

    :root {
      /* サイト全体のデフォルトフォントを指定 */
      /* --base-font-family: 'Noto Sans JP', sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; */
      /* --base-font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; */
      /* --base-font-family: 'M PLUS Rounded 1c', sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; */
      --base-font-family: 'BIZ UDPGothic', sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    }

    html, body, article, main, section, div, p, span, li, a, h1, h2, h3, h4, h5, h6, .markdown-section {
      /* font-family: var(--base-font-family); */
      text-decoration: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
      background-image: none !important;
    }

    h1, h2 {
      font-family: 'Noto Sans JP', sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      /* font-family: 'BIZ UDPGothic', sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; */
      font-weight: 700;
      font-style: normal;
    }

    .markdown-section {
      font-family: 'BIZ UDPGothic', sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    }

    /* カバーページ */
    section.cover h1,
    section.cover h2,
    section.cover h3,
    section.cover p,
    section.cover a {
      font-family: var(--base-font-family) !important;
      color: #ffffff !important;
    }

    section.cover h1,
    section.cover h2 {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      // name: 'My Notes',
      // repo: 'https://github.com/uenouan/uenouan.github.io', // 右上にGitHubリボンを表示
      loadNavbar: true,    // 右上のナビゲーションバー (_navbar.md)
      loadSidebar: true,   // 左側のサイドバー (_sidebar.md)
      subMaxLevel: 0,      // サイドバーに自動表示する記事内見出しの深さ (H2〜H3)
      coverpage: true,     // カバーページ / 表紙バナー (_coverpage.md)
      onlyCover: false,    // カバーページから本文にスクロールしない
      auto2top: true,      // ページ遷移時に自動で最上部にスクロール

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

</body>

</html>
